name: Aria native release build

on:
  workflow_call:
    secrets:
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
    inputs:
      platform:
        type: string
        required: true
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
      mode:
        type: string
        required: true
      source:
        type: string
        required: true

permissions: {}

jobs:
  package:
    if: inputs.mode == 'verify' || (inputs.mode == 'publish' && github.repository == 'manaplatform/Aria' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    environment: ${{ inputs.mode == 'publish' && inputs.platform != 'macos' && format('aria-{0}-signing', inputs.platform) || 'aria-release-verification' }}
    permissions:
      contents: read
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load packaging scripts from the release workflow commit
        if: inputs.source != github.sha
        shell: bash
        env:
          RELEASE_WORKFLOW_SHA: ${{ github.sha }}
        run: git restore --source="$RELEASE_WORKFLOW_SHA" --worktree -- scripts/release
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - if: runner.os == 'Linux'
        name: Install Linux package and display tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2t64 rpm fakeroot dpkg-dev xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 dbus-x11 gnome-keyring
      - name: Confirm native architecture
        run: node -e "if (process.arch !== process.env.RELEASE_ARCH) throw Error('Wrong runner architecture')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ARIA_STAGE_RELEASE_NOTICES: '1'
      - run: pnpm --filter @aria/desktop exec node scripts/ensure-electron.cjs
      - run: pnpm licenses:check
      - name: Build native installers
        shell: bash
        env:
          ARIA_UPDATE_PUBLIC_KEYS: ${{ inputs.mode == 'publish' && vars.ARIA_UPDATE_PUBLIC_KEYS || '' }}
          ARIA_WINDOWS_SIGNER_SHA256: ${{ vars.ARIA_WINDOWS_SIGNER_SHA256 }}
          ARIA_WINDOWS_ADDITIONAL_SIGNERS_SHA256: ${{ vars.ARIA_WINDOWS_ADDITIONAL_SIGNERS_SHA256 }}
          WIN_CSC_LINK: ${{ inputs.mode == 'publish' && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ inputs.mode == 'publish' && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: pnpm release:package "$RELEASE_MODE"
      - name: Verify native packages and bundled chat
        shell: bash
        env:
          ARIA_WINDOWS_SIGNER_SHA256: ${{ vars.ARIA_WINDOWS_SIGNER_SHA256 }}
        run: |
          args=(--experimental-strip-types scripts/release/verify-desktop.mjs apps/desktop/out/release-packages checked "$RELEASE_MODE")
          if [[ "$RUNNER_OS" == Linux ]]; then
            export XDG_DATA_HOME
            XDG_DATA_HOME=$(mktemp -d "$RUNNER_TEMP/aria-keyring.XXXXXX")
            trap 'rm -rf "$XDG_DATA_HOME"' EXIT
            dbus-run-session -- bash -euc 'printf "%s\n" "package-smoke-only" | gnome-keyring-daemon --unlock --components=secrets
              exec xvfb-run -a node "$@"' -- "${args[@]}"
          else
            node "${args[@]}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aria-${{ inputs.platform }}-${{ inputs.arch }}
          path: checked/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0
