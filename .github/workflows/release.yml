name: Aria Release Creator

on:
  push:
    # Compare the committed root versions in prepare, including on large merges.
    branches: [main]
  schedule:
    # GitHub Actions does not receive events when a release draft is saved.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Choose preview, native verification, or protected publication
        type: choice
        options: [preview, verify, publish]
        default: preview

permissions: {}

concurrency:
  group: ${{ (github.event_name != 'workflow_dispatch' || inputs.mode == 'publish') && 'aria-production-release' || format('aria-release-verification-{0}', github.run_id) }}
  queue: max

jobs:
  claim-release-draft:
    if: >-
      github.event_name == 'schedule' && github.repository == 'manaplatform/Aria' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.ARIA_RELEASE_ENABLED == 'true' && vars.ARIA_DISTRIBUTION_AUTHORIZED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # GitHub requires push access to list drafts.
      contents: write
    outputs:
      id: ${{ steps.claim.outputs.id }}
      source: ${{ steps.claim.outputs.source }}
      tag: ${{ steps.claim.outputs.tag }}
    steps:
      - name: Check for release requests
        id: drafts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          drafts=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            jq -r --arg marker "<!-- Aria release request run $GITHUB_RUN_ID tag " '
              .[][] | select(.draft) |
              select(((.tag_name | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}(\\.[1-9][0-9]*|-[2-9]|-[1-9][0-9]+)?$")) and
                      (.assets | length) == 0 and ((.body // "") | test("^\\s*$"))) or
                ((.body // "") | contains($marker))) |
              .id')
          if [[ -n "$drafts" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.drafts.outputs.found == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.drafts.outputs.found == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.drafts.outputs.found == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - if: steps.drafts.outputs.found == 'true'
        run: pnpm --filter aria install --frozen-lockfile --ignore-scripts
      - if: steps.drafts.outputs.found == 'true'
        name: Bind the draft to this workflow and source commit
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          ARIA_RELEASE_ENABLED: ${{ vars.ARIA_RELEASE_ENABLED }}
          ARIA_DISTRIBUTION_AUTHORIZED: ${{ vars.ARIA_DISTRIBUTION_AUTHORIZED }}
        run: node scripts/release/run.mjs claim-draft

  prepare-release:
    needs: claim-release-draft
    if: >-
      !cancelled() && !failure() && github.repository == 'manaplatform/Aria' &&
      (github.event_name != 'schedule' || needs.claim-release-draft.outputs.id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.prepare.outputs.run }}
      mode: ${{ steps.prepare.outputs.mode }}
      source: ${{ steps.prepare.outputs.source }}
      draft-id: ${{ needs.claim-release-draft.outputs.id }}
      draft-tag: ${{ needs.claim-release-draft.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm --filter aria install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Select the release candidate
        id: prepare
        env:
          RELEASE_MODE: ${{ github.event_name != 'workflow_dispatch' && 'publish' || inputs.mode }}
          RELEASE_SOURCE: ${{ needs.claim-release-draft.outputs.source }}
          RELEASE_DRAFT_TAG: ${{ needs.claim-release-draft.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          ARIA_RELEASE_ENABLED: ${{ vars.ARIA_RELEASE_ENABLED }}
          ARIA_DISTRIBUTION_AUTHORIZED: ${{ vars.ARIA_DISTRIBUTION_AUTHORIZED }}
        run: node scripts/release/run.mjs prepare "$RELEASE_MODE"
      - if: steps.prepare.outputs.mode == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:preview | tee -a "$GITHUB_STEP_SUMMARY"

  validate-version:
    if: needs.prepare-release.outputs.run == 'true' && needs.prepare-release.outputs.mode != 'preview'
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm --filter aria install --frozen-lockfile --ignore-scripts
      - run: pnpm release:check

  lint-typecheck-test:
    needs: [prepare-release, validate-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm release:test
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop/program-runner
      - run: node --experimental-strip-types --test runner.test.mts
        working-directory: apps/desktop/program-runner

  build-windows:
    needs: [prepare-release, lint-typecheck-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2025 }
          - { arch: arm64, runner: windows-11-arm }
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      platform: windows
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      mode: ${{ needs.prepare-release.outputs.mode }}
      source: ${{ needs.prepare-release.outputs.source }}

  build-macos:
    needs: [prepare-release, lint-typecheck-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: macos-15-intel }
          - { arch: arm64, runner: macos-15 }
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      platform: macos
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      mode: ${{ needs.prepare-release.outputs.mode }}
      source: ${{ needs.prepare-release.outputs.source }}

  build-linux:
    needs: [prepare-release, lint-typecheck-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      platform: linux
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      mode: ${{ needs.prepare-release.outputs.mode }}
      source: ${{ needs.prepare-release.outputs.source }}

  verify-artifacts:
    needs: [prepare-release, build-windows, build-macos, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      timestamp: ${{ steps.inventory.outputs.timestamp }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm --filter aria install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: aria-*
          path: incoming
      - name: Verify checksums and generate update metadata and SBOM
        id: inventory
        env:
          RELEASE_MODE: ${{ needs.prepare-release.outputs.mode }}
          RELEASE_SOURCE: ${{ needs.prepare-release.outputs.source }}
        run: node scripts/release/run.mjs verify-builds incoming verified "$RELEASE_MODE"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: verified/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-release-assets
          path: verified/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0

  publish-release:
    if: needs.prepare-release.outputs.mode == 'publish' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [prepare-release, verify-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: aria-release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm --filter aria install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-release-assets
          path: verified
      - name: Sign metadata, reserve tag, verify draft assets and publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          ARIA_RELEASE_ENABLED: ${{ vars.ARIA_RELEASE_ENABLED }}
          ARIA_DISTRIBUTION_AUTHORIZED: ${{ vars.ARIA_DISTRIBUTION_AUTHORIZED }}
          ARIA_UPDATE_PUBLIC_KEYS: ${{ vars.ARIA_UPDATE_PUBLIC_KEYS }}
          ARIA_UPDATE_PRIVATE_KEY: ${{ secrets.ARIA_UPDATE_PRIVATE_KEY }}
          BUILD_TIMESTAMP: ${{ needs.verify-artifacts.outputs.timestamp }}
          RELEASE_SOURCE: ${{ needs.prepare-release.outputs.source }}
          RELEASE_DRAFT_ID: ${{ needs.prepare-release.outputs.draft-id }}
          RELEASE_DRAFT_TAG: ${{ needs.prepare-release.outputs.draft-tag }}
        run: node scripts/release/run.mjs publish verified "$BUILD_TIMESTAMP"
