name: Desktop checks
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @aria/desktop exec node scripts/ensure-electron.cjs
      - run: pnpm --filter @aria/desktop test:electron
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-artifacts-${{ matrix.os }}
          include-hidden-files: true
          path: |
            apps/desktop/.artifacts/
            apps/desktop/test-results/
